[extend]
useDefault = true

# The PWA manifest stores SHA-256 content hashes, including tokens.css.
[[allowlists]]
description = "PWA static asset content hashes"
condition = "AND"
paths = ['''^static/pos/js/sw-manifest\.json$''']
regexTarget = "line"
regexes = ['''"/static/[^"\r\n]+":\s*"[a-f0-9]{64}"''']
