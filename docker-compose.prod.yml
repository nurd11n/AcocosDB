# Production: docker compose -f docker-compose.prod.yml up -d
#
# Every service restarts unless-stopped and rotates its logs (10m × 3 files) so
# a chatty container can never fill the disk and take the database down with it.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Explicit public resolvers so containers can always resolve external hosts —
# NBKR for exchange rates, Gmail SMTP for the daily report, Backblaze for
# offsite backups. Docker normally copies the host's /etc/resolv.conf into each
# container, and on some hosts (DigitalOcean + systemd-resolved is the classic
# case) that points at a link-local stub the container can't reach, so every
# outbound name lookup fails with "Failed to resolve ...". Pinning the resolver
# here makes name resolution deterministic regardless of the host's setup.
x-dns: &default-dns
  - "8.8.8.8"
  - "1.1.1.1"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    dns: *default-dns
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    env_file: .env
    volumes:
      - media:/app/media
    expose:
      - "8000"
    healthcheck:
      # /healthz/ returns 200 only when DB + cache both answer; 503 otherwise.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    dns: *default-dns
    entrypoint: []
    command: python bot/main.py
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    dns: *default-dns
    entrypoint: []
    command: python scheduler.py
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Uploaded photos, served by Caddy (see the /media/ block in the
      # Caddyfile). READ-ONLY on purpose: Caddy only ever needs to read these,
      # so a flaw here can't write into the volume the web container uploads to.
      - media:/srv/media:ro
      # Access log (see the Caddyfile's `log` block), bind-mounted (not a
      # named volume) so fail2ban — which runs on the HOST, not in a
      # container — can tail it directly at ./caddy_logs/access.log. See
      # README's "Application-layer hardening" section for the jail.
      - ./caddy_logs:/var/log/caddy

  # Encrypted, checksummed backups every 6 hours, synced offsite to B2.
  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    dns: *default-dns
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    env_file: .env
    volumes:
      - ./backups:/backups
      - media:/media:ro
    depends_on:
      db:
        condition: service_healthy

  # Weekly restore drill: restores the latest dump into a scratch DB, asserts,
  # Telegrams the Owner the result, and drops it. Reuses the backup image.
  restore-drill:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    dns: *default-dns
    entrypoint: ["sh", "/usr/local/bin/restore_drill.sh"]
    env_file: .env
    volumes:
      - ./backups:/backups:ro
      - ./secrets/age_identity.txt:/run/age_identity.txt:ro
    environment:
      AGE_IDENTITY_FILE: /run/age_identity.txt
    depends_on:
      db:
        condition: service_healthy

volumes:
  # SECURITY: pgdata (and media) hold client names, phones, and debts. Docker
  # named volumes are NOT encrypted — the Docker data root (default
  # /var/lib/docker) MUST live on an encrypted host disk (LUKS, or a
  # provider-encrypted volume). Verify with `lsblk -o NAME,MOUNTPOINT,TYPE` +
  # `cryptsetup status`, or your cloud's disk-encryption setting, before go-live.
  pgdata:
  redisdata:
  media:
  caddy_data:
  caddy_config:
