# Local development: web (runserver, hot reload) + db.
services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Telegram staff + client bots (bot/main.py starts whichever tokens are set
  # in .env). entrypoint is cleared so it doesn't re-run migrate/collectstatic
  # on top of web's — just polls Telegram.
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: []
    command: python bot/main.py
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
