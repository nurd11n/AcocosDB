# fail2ban jail fragment for repeated 401/403/429 in Caddy's access log.
# Install: see README's "Application-layer hardening" section — this file is
# a template copied into /etc/fail2ban/jail.d/ with the real repo path filled
# in, not used in place.
[caddy-abuse]
enabled   = true
filter    = caddy-abuse
logpath   = /path/to/acocosDB/caddy_logs/access.log
backend   = auto
banaction = ufw
maxretry  = 20
findtime  = 10m
bantime   = 1h
