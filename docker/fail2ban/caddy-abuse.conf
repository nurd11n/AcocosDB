# fail2ban filter for Caddy's JSON access log (docker/Caddyfile's `log` block,
# bind-mounted to ./caddy_logs/access.log — see docker-compose.prod.yml and
# README's "Application-layer hardening" section).
#
# Matches any line where the request's remote_ip is followed (later in the
# same JSON object) by an auth-failure/forbidden/rate-limited status code.
# Caddy's zap-based JSON encoder always emits "request" (which nests
# "remote_ip") before the top-level "status" field, so this ordering is
# stable — not a guess.
#
# 401 — never actually produced by this app (no HTTP Basic/Bearer auth
#       surface), included for completeness/defense in depth.
# 403 — django-otp/permission checks (apps.core.middleware.
#       SecurityEventLoggingMiddleware also logs these into SecurityEvent).
# 429 — apps.core.ratelimit's rate limiter (login, receipt/report download,
#       search/autocomplete, the WhatsApp webhook).
[Definition]
failregex = ^\{.*"request":\{"remote_ip":"<HOST>".*"status":(401|403|429),
ignoreregex =
